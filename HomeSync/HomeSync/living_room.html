<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSync - Phòng khách</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-house-signal"></i>
                <span>HomeSync</span>
            </div>
            <nav class="menu">
                <a href="index.html" class="menu-item">
                    <i class="fa-solid fa-border-all"></i>
                    <span>Tổng quan</span>
                </a>
                <a href="living_room.html" class="menu-item active">
                    <i class="fa-solid fa-couch"></i>
                    <span>Phòng khách</span>
                </a>
                <a href="bedroom.html" class="menu-item">
                    <i class="fa-solid fa-bed"></i>
                    <span>Phòng ngủ</span>
                </a>
                <a href="kitchen.html" class="menu-item">
                    <i class="fa-solid fa-fire-burner"></i>
                    <span>Nhà bếp</span>
                </a>
                <a href="garden.html" class="menu-item">
                    <i class="fa-solid fa-tree"></i>
                    <span>Sân vườn</span>
                </a>
                <a href="devices.html" class="menu-item">
                    <i class="fa-solid fa-list"></i>
                    <span>Thiết bị</span>
                </a>
                <a href="settings.html" class="menu-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Cài đặt</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Tìm kiếm thiết bị, phòng...">
                </div>
                <div class="header-actions">
                    <div class="notification-bell">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="User">
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- Mục 1: Header & Môi trường -->
                <div class="page-header-flex">
                    <h1 class="page-title">Quản lý Phòng khách</h1>
                </div>

                <section class="hero-stats">
                    <div class="stat-card">
                        <div class="stat-icon temperature"><i class="fa-solid fa-temperature-half"></i></div>
                        <div class="stat-info">
                            <h3>Nhiệt độ</h3>
                            <p>26°C</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon humidity"><i class="fa-solid fa-droplet"></i></div>
                        <div class="stat-info">
                            <h3>Độ ẩm</h3>
                            <p>55%</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon power"><i class="fa-solid fa-wind"></i></div>
                        <div class="stat-info">
                            <h3>Không khí</h3>
                            <p>Tốt</p>
                        </div>
                    </div>
                </section>

                <!-- Mục 2: Chế độ ngữ cảnh (Selection Control) -->
                <section class="scene-control">
                    <h2 class="section-title">Chế độ ngữ cảnh</h2>
                    <div class="scene-buttons">
                        <button class="scene-btn" onclick="setScene(this)">Tiếp khách</button>
                        <button class="scene-btn active" onclick="setScene(this)">Xem phim</button>
                        <button class="scene-btn" onclick="setScene(this)">Ra ngoài</button>
                    </div>
                </section>

                <div class="room-grid">
                    <!-- Mục 3: Máy lọc không khí (Mới) -->
                    <section class="control-card">
                        <div class="card-header">
                            <div class="header-title">
                                <i class="fa-solid fa-fan icon-lg"></i>
                                <h3>Máy lọc không khí</h3>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" data-device-id="air-purifier-living">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="mt-3">
                            <label>Chế độ quạt</label>
                            <select id="air-purifier-speed" class="custom-select" style="margin-top:0.6rem;">
                                <option value="low">Thấp</option>
                                <option value="medium">Trung bình</option>
                                <option value="high">Cao</option>
                                <option value="auto">Tự động</option>
                            </select>
                        </div>
                    </section>

                    <!-- Mục 3: Điều khiển TV & Giải trí -->
                    <section class="control-card tv-control">
                        <div class="card-header">
                            <div class="header-title">
                                <i class="fa-solid fa-tv icon-lg"></i>
                                <h3>Smart TV</h3>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" data-device-id="tv-living" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="sliders-container">
                            <div class="slider-group">
                                <label>Âm lượng <span class="val" id="vol-val">45%</span></label>
                                <input type="range" id="tv-volume-slider" class="custom-slider" min="0" max="100"
                                    value="45">
                            </div>
                            <div class="slider-group">
                                <label>Độ sáng <span class="val" id="bright-val">80%</span></label>
                                <input type="range" id="tv-brightness-slider" class="custom-slider" min="0" max="100"
                                    value="80">
                            </div>
                        </div>
                    </section>

                    <!-- Mục 4: Hệ thống Chiếu sáng & Rèm cửa -->
                    <div class="control-grid-2">
                        <section class="control-card">
                            <div class="card-header">
                                <div class="header-title">
                                    <i class="fa-regular fa-lightbulb icon-lg"></i>
                                    <h3>Đèn trần</h3>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" data-device-id="light-living" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="slider-group mt-3">
                                <label>Độ sáng <span class="val" id="light-val">70%</span></label>
                                <input type="range" id="light-slider" class="custom-slider" min="0" max="100"
                                    value="70">
                            </div>
                        </section>

                        <section class="control-card">
                            <div class="card-header">
                                <div class="header-title">
                                    <i class="fa-solid fa-person-shelter icon-lg"></i>
                                    <h3>Rèm cửa</h3>
                                </div>
                            </div>
                            <div class="slider-group mt-3">
                                <label>Độ mở <span class="val" id="curtain-val">100%</span></label>
                                <input type="range" id="curtain-slider" class="custom-slider" min="0" max="100"
                                    value="100">
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script JS cơ bản cho trang Phòng khách -->
    <script src="living_room.js"></script>
    <script src="globalState.js"></script>
</body>

</html>
