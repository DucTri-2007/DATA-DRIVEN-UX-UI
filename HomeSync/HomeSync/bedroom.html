<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSync - Phòng ngủ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-house-signal"></i>
                <span>HomeSync</span>
            </div>
            <nav class="menu">
                <a href="index.html" class="menu-item">
                    <i class="fa-solid fa-border-all"></i>
                    <span>Tổng quan</span>
                </a>
                <a href="living_room.html" class="menu-item">
                    <i class="fa-solid fa-couch"></i>
                    <span>Phòng khách</span>
                </a>
                <a href="bedroom.html" class="menu-item active">
                    <i class="fa-solid fa-bed"></i>
                    <span>Phòng ngủ</span>
                </a>
                <a href="kitchen.html" class="menu-item">
                    <i class="fa-solid fa-fire-burner"></i>
                    <span>Nhà bếp</span>
                </a>
                <a href="garden.html" class="menu-item">
                    <i class="fa-solid fa-tree"></i>
                    <span>Sân vườn</span>
                </a>
                <a href="devices.html" class="menu-item">
                    <i class="fa-solid fa-list"></i>
                    <span>Thiết bị</span>
                </a>
                <a href="settings.html" class="menu-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Cài đặt</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Tìm kiếm thiết bị, phòng...">
                </div>
                <div class="header-actions">
                    <div class="notification-bell">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="User">
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- Mục 1: Tiêu đề & Chế độ Ngủ -->
                <div class="page-header-flex">
                    <h1 class="page-title">Quản lý Phòng ngủ</h1>
                    <div class="night-mode-toggle">
                        <span>Chế độ ban đêm</span>
                        <label class="toggle-switch large">
                            <input type="checkbox" id="night-mode-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- Mục 2: Điều khiển Điều hòa -->
                <section class="ac-control-panel">
                    <div class="ac-header">
                        <i class="fa-solid fa-snowflake"></i>
                        <h3>Điều hòa trung tâm</h3>
                    </div>
                    <div class="ac-temp-display">
                        <button class="temp-btn" onclick="changeTemp(-1)"><i class="fa-solid fa-minus"></i></button>
                        <div class="temp-value"><span id="ac-temp">24</span>°C</div>
                        <button class="temp-btn" onclick="changeTemp(1)"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" data-device-id="ac-bedroom" checked>
                        <span class="slider"></span>
                    </label>
                </section>

                <div class="room-grid">
                    <!-- Mục 3: Đèn ngủ & Đèn đọc sách -->
                    <div class="control-grid-2">
                        <!-- Đèn ngủ -->
                        <section class="control-card">
                            <div class="card-header">
                                <div class="header-title">
                                    <i class="fa-solid fa-lamp icon-lg"></i>
                                    <h3>Đèn ngủ</h3>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" data-device-id="night-light-bedroom" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="color-picker-group mt-3">
                                <label>Màu sắc</label>
                                <input type="color" id="night-light-color" class="custom-color-picker" value="#ff9e00">
                            </div>
                        </section>

                        <!-- Đèn đọc sách -->
                        <section class="control-card">
                            <div class="card-header">
                                <div class="header-title">
                                    <i class="fa-solid fa-book-open icon-lg"></i>
                                    <h3>Đèn đọc</h3>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" data-device-id="read-light-bedroom">
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="slider-group mt-3">
                                <label>Độ sáng <span class="val" id="read-light-val">50%</span></label>
                                <input type="range" id="read-light-brightness" class="custom-slider"
                                    data-no-global-toast="true" min="0" max="100" value="50">
                            </div>
                        </section>

                        <!-- Loa thông minh (Mới) -->
                        <section class="control-card">
                            <div class="card-header">
                                <div class="header-title">
                                    <i class="fa-solid fa-speaker-high icon-lg"></i>
                                    <h3>Loa thông minh</h3>
                                </div>
                            </div>
                            <div class="slider-group mt-3">
                                <label>Âm lượng <span class="val" id="speaker-val">30%</span></label>
                                <input type="range" id="speaker-volume" class="custom-slider"
                                    data-no-global-toast="true" min="0" max="100" value="30">
                            </div>
                        </section>
                    </div>

                    <!-- Mục 4: Hẹn giờ - Task Flow -->
                    <section class="control-card timer-card">
                        <div class="card-header mb-3">
                            <div class="header-title">
                                <i class="fa-regular fa-clock icon-lg"></i>
                                <h3>Hẹn giờ đánh thức</h3>
                            </div>
                        </div>
                        <form class="timer-form" onsubmit="event.preventDefault(); saveTimer();">
                            <div class="time-inputs">
                                <input type="number" id="timer-hour" min="0" max="23" placeholder="Giờ" value="06">
                                <span>:</span>
                                <input type="number" id="timer-minute" min="0" max="59" placeholder="Phút" value="30">
                            </div>
                            <button type="submit" class="btn-primary w-100">Lưu cài đặt</button>
                        </form>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <!-- Script JS cơ bản cho trang Phòng ngủ -->
    <script src="bedroom.js"></script>
    <script src="globalState.js"></script>
</body>

</html>
